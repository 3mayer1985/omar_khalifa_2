<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 72 72" width="72" height="72">
  <!-- board -->
  <rect x="6" y="6" width="60" height="60" rx="8" fill="#1f7a3d" stroke="#0d3d1e" stroke-width="2.5"/>

  <!-- mounting holes -->
  <circle cx="12.5" cy="12.5" r="2.6" fill="#cfd6d3" stroke="#0d3d1e" stroke-width="1.4"/>
  <circle cx="59.5" cy="12.5" r="2.6" fill="#cfd6d3" stroke="#0d3d1e" stroke-width="1.4"/>
  <circle cx="12.5" cy="59.5" r="2.6" fill="#cfd6d3" stroke="#0d3d1e" stroke-width="1.4"/>
  <circle cx="59.5" cy="59.5" r="2.6" fill="#cfd6d3" stroke="#0d3d1e" stroke-width="1.4"/>

  <!-- copper traces / routing -->
  <g fill="none" stroke="#e3ab3d" stroke-width="2" stroke-linecap="round">
    <path d="M18 18 H27"/>
    <path d="M18 18 V27"/>
    <path d="M54 18 H45"/>
    <path d="M54 18 V27"/>
    <path d="M18 54 H27"/>
    <path d="M18 54 V45"/>
    <path d="M54 54 H45"/>
    <path d="M54 54 V45"/>
    <path d="M36 12 V21"/>
    <path d="M36 51 V60"/>
    <path d="M12 36 H21"/>
    <path d="M51 36 H60"/>
  </g>
  <g fill="#f3c65f" stroke="#0d3d1e" stroke-width="1">
    <circle cx="18" cy="18" r="2.2"/>
    <circle cx="54" cy="18" r="2.2"/>
    <circle cx="18" cy="54" r="2.2"/>
    <circle cx="54" cy="54" r="2.2"/>
    <circle cx="36" cy="12" r="1.8"/>
    <circle cx="36" cy="60" r="1.8"/>
    <circle cx="12" cy="36" r="1.8"/>
    <circle cx="60" cy="36" r="1.8"/>
  </g>

  <!-- chip pins -->
  <g fill="#3a3a3a" stroke="#0d3d1e" stroke-width="1">
    <rect x="29" y="21" width="3" height="6"/>
    <rect x="34.5" y="21" width="3" height="6"/>
    <rect x="40" y="21" width="3" height="6"/>
    <rect x="29" y="45" width="3" height="6"/>
    <rect x="34.5" y="45" width="3" height="6"/>
    <rect x="40" y="45" width="3" height="6"/>
    <rect x="21" y="29" width="6" height="3"/>
    <rect x="21" y="34.5" width="6" height="3"/>
    <rect x="21" y="40" width="6" height="3"/>
    <rect x="45" y="29" width="6" height="3"/>
    <rect x="45" y="34.5" width="6" height="3"/>
    <rect x="45" y="40" width="6" height="3"/>
  </g>

  <!-- chip body -->
  <rect x="27" y="27" width="18" height="18" rx="2" fill="#1a1a1a" stroke="#000" stroke-width="1.6"/>
  <circle cx="30.5" cy="30.5" r="1.5" fill="#cfcfcf"/>
